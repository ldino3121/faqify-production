<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQify - AI-Powered FAQ Generator</title>
    <meta name="description" content="Generate intelligent FAQs for your website with AI-powered content analysis" />
    <meta name="author" content="FAQify" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/faqify-logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/faqify-logo.svg" />

    <meta property="og:title" content="FAQify - AI-Powered FAQ Generator" />
    <meta property="og:description" content="Generate intelligent FAQs for your website with AI-powered content analysis" />
    <meta property="og:type" content="website" />
    <!-- %APP_URL% is substituted at build time (Vite html tokens); other env values never leak here. -->
    <meta property="og:image" content="%APP_URL%/faqify-og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@faqify" />
    <meta name="twitter:image" content="%APP_URL%/faqify-og-image.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "FAQify",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "AI-powered FAQ generator that turns your website content into embeddable FAQ widgets that reduce bounce and deflect support tickets.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
