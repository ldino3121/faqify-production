name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Hard gate: the production build must succeed (this is what Vercel runs).
      - name: Build
        run: npm run build

      # Hard gate: unit tests must pass.
      - name: Test
        run: npm test

      # Informational only: the repo has a backlog of pre-existing type/lint
      # errors, so these do not fail the pipeline yet. See REMEDIATION-SPEC.md (P0-5).
      - name: Typecheck (informational)
        run: npm run typecheck
        continue-on-error: true
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true
