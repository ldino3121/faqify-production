name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Hard gate: the production build must succeed (this is what Vercel runs).
      - name: Build
        run: npm run build

      # Hard gate: unit tests must pass.
      - name: Test
        run: npm test

      # Hard gates: typecheck and lint must pass (these previously had
      # continue-on-error: true and silently masked failures).
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
