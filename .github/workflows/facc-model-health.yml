name: FACC model health

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check approved models with a bounded synthetic probe
        env:
          FACC_MONITOR_TOKEN: ${{ secrets.FACC_MONITOR_TOKEN }}
          FAQIFY_SUPABASE_ANON_KEY: ${{ secrets.FAQIFY_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$FACC_MONITOR_TOKEN" ] || [ -z "$FAQIFY_SUPABASE_ANON_KEY" ]; then
            echo 'FACC monitoring is not configured: FACC_MONITOR_TOKEN and FAQIFY_SUPABASE_ANON_KEY are required.'
            exit 1
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 180 \
            --request POST 'https://dlzshcshqjdghmtzlbma.supabase.co/functions/v1/admin-model-monitor' \
            --header "apikey: $FAQIFY_SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $FAQIFY_SUPABASE_ANON_KEY" \
            --header "x-facc-monitor-token: $FACC_MONITOR_TOKEN" \
            --header 'content-type: application/json' \
            --data '{}')
          if [ "$status" != 200 ]; then
            echo "FACC model check failed with HTTP $status"
            exit 1
          fi
          echo 'FACC model check request completed.'
